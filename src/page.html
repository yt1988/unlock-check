<!doctype html>
<html lang="{{lang}}" data-paths="{{pathsAttr}}"{{rootAttr}}>
<head>
<meta charset="utf-8">
<script>{{prepaint}}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
{{head}}
<link rel="preload" href="/assets/fonts/geist-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/assets/{{css}}">
</head>
<body>
<div class="app">
  <header class="top">
    <a class="brand" href="{{homeHref}}">
      <span class="logo"><img class="logo-light" src="/assets/logo-light.svg" width="90" height="36" alt="1ms"><img class="logo-dark" src="/assets/logo-dark.svg" width="90" height="36" alt="1ms"></span>
      <span class="brand-name" data-i="name"></span>
    </a>
    <div class="top-acts">
      <label class="sel"><span class="sr" data-i="lang_label"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5"/><path d="M1.5 8h13M8 1.5c2 2 2.8 4 2.8 6.5S10 12.5 8 14.5C6 12.5 5.2 10.5 5.2 8S6 3.5 8 1.5z"/></svg>
        <select id="lang">{{langOpts}}</select>
      </label>
      <button class="icon-btn" id="helpBtn" type="button" aria-haspopup="dialog" aria-controls="help"><span class="sr" data-i="faq_h"></span>
        <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"/><path d="M6.3 6.2a1.8 1.8 0 1 1 2.5 1.7c-.5.2-.8.6-.8 1.1v.4M8 11.3v.1"/></svg>
      </button>
      <a class="icon-btn gh" href="{{repo}}" target="_blank" rel="noopener noreferrer" title="GitHub" aria-label="GitHub"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 .2a8 8 0 0 0-2.5 15.6c.4 0 .5-.2.5-.4v-1.5c-2.2.5-2.7-1-2.7-1-.4-.9-.9-1.2-.9-1.2-.7-.5.1-.5.1-.5.8.1 1.2.8 1.2.8.7 1.3 1.9.9 2.4.7 0-.5.3-.9.5-1.1-1.8-.2-3.6-.9-3.6-4 0-.9.3-1.6.8-2.1-.1-.2-.4-1 .1-2.1 0 0 .7-.2 2.2.8a7.4 7.4 0 0 1 4 0c1.5-1 2.2-.8 2.2-.8.4 1.1.2 1.9.1 2.1.5.6.8 1.3.8 2.1 0 3.1-1.9 3.7-3.6 3.9.3.3.6.8.6 1.5v2.2c0 .2.1.5.6.4A8 8 0 0 0 8 .2z"/></svg></a>
      <button class="icon-btn" id="theme" type="button" aria-label="{{themeLabel}}">
        <svg class="i-sys" viewBox="0 0 16 16" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.5"/><path d="M5.5 14h5M8 11.5V14"/></svg>
        <svg class="i-light" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1v1.6M8 13.4V15M1 8h1.6M13.4 8H15M3 3l1.1 1.1M11.9 11.9 13 13M3 13l1.1-1.1M11.9 4.1 13 3"/></svg>
        <svg class="i-dark" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.8A5.8 5.8 0 0 1 6.2 2.5a5.8 5.8 0 1 0 7.3 7.3z"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section class="hero card">
      <div class="hero-h">
        <p class="shared" id="shared"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 9.5l3-3M7 4.5l1-1a2.5 2.5 0 0 1 3.5 3.5l-1 1M9 11.5l-1 1a2.5 2.5 0 0 1-3.5-3.5l1-1"/></svg><span id="sharedTxt"></span></p>
        <h1>{{h1}}</h1>
        <p class="intro">{{intro}}</p>
      </div>
      {{focus}}
      <div class="sum" id="sum">
        <div class="tot t-ok"><b>–</b><span data-i="v_ok"></span></div>
        <div class="tot t-no"><b>–</b><span data-i="v_no"></span></div>
        <div class="tot t-reach"><b>–</b><span data-i="v_reach"></span></div>
        <div class="tot t-fail"><b>–</b><span data-i="v_fail"></span></div>
      </div>
      <ul class="notes" id="notes">{{notesWait}}</ul>
      <div class="bar">
        <div class="prog" id="prog"><i></i></div>
        <span class="prog-t" id="progTxt"></span>
        <div class="acts">
          <button class="btn" id="eye" type="button" data-i="hide"></button>
          <button class="btn" id="share" type="button" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 10V2M5 4.5 8 1.5l3 3M3.5 8v5.5h9V8"/></svg><span data-i="share"></span></button>
          <button class="btn pri" id="run" type="button" disabled><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9M13.5 2v3h-3"/></svg><span data-i="rerun"></span></button>
        </div>
      </div>
    </section>

    <section class="list card">
{{groups}}
    </section>
  </main>

  <footer class="foot">
    <nav class="foot-nav">{{nav}}</nav>
    <p><a href="{{repo}}" target="_blank" rel="noopener noreferrer">GitHub</a></p>
  </footer>
</div>
<div class="scrim" id="help" hidden>
  <div class="dialog help" role="dialog" aria-modal="true" aria-labelledby="helpT">
    <div class="dlg-h"><h2 id="helpT" data-i="faq_h"></h2>
      <button class="icon-btn" data-close type="button" aria-label="{{closeLabel}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button></div>
    <div class="help-b">
      <nav class="help-nav" id="helpNav" role="tablist">{{helpNav}}</nav>
      <div class="help-pick">
        <button class="icon-btn" type="button" data-hstep="-1" aria-label="{{prevLabel}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 4L6 8l4 4"/></svg></button>
        <select id="helpSel" aria-labelledby="helpT"></select>
        <button class="icon-btn" type="button" data-hstep="1" aria-label="{{nextLabel}}"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 4l4 4-4 4"/></svg></button>
      </div>
      <div class="help-c" id="helpC">{{helpC}}</div>
    </div>
  </div>
</div>
<script type="application/json" id="data">{{data}}</script>
<script src="/assets/{{strings}}"></script>
<script src="/assets/{{js}}" defer></script>
</body>
</html>
