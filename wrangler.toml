# Cloudflare Workers with static assets: `npx wrangler deploy` uploads ./public and deploys src/worker.js.
# The HTML pages run through the Worker so it can add the deployment's measurement endpoints from MS_ANCHORS and
# MS_EGRESS (docs/tool-contract.md §2); everything else is served straight from the assets layer. Without those
# variables no meta is added and the page hides the split hint. No routes or custom domain here: bind your own
# domain in the dashboard (see README).
name = "unlock"
main = "src/worker.js"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
binding = "ASSETS"
# the HTML pages: /, /<lang>/, /<slug>/, /<lang>/<slug>/, and the shared result pages; assets keep being served
# straight from the assets layer
run_worker_first = ["/", "/*/", "/*/*/", "/*/*/*/"]
