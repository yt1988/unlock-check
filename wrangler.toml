# Cloudflare Workers with static assets: `npx wrangler deploy` uploads ./public.
# There is no Worker script, so every request is a static asset request (free and not metered), the redirect chain
# in public/_redirects included. No routes or custom domain here: bind your own domain in the dashboard (see README).
name = "unlock"
compatibility_date = "2025-10-01"
workers_dev = false
preview_urls = false

[assets]
directory = "./public"
